NFS_CORE_PARAM {
    Protocols = 4;
    NFS_Port = 2049;
    Enable_NLM = false;
    Enable_RQUOTA = false;
}

NFSv4 {
    Graceless = true;
}

EXPORT {
    Export_Id = 1;
    Path = /exports/dfs;
    Pseudo = /dfs;
    Access_Type = RW;
    Squash = No_Root_Squash;
    SecType = sys;
    Protocols = 4;
    Transports = TCP;
    FSAL {
        Name = VFS;
    }
}
