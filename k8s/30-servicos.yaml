# Microsservicos. Os pedidos de CPU (requests) sao obrigatorios para o HPA calcular a utilizacao.
# Transparencia de localizacao: cada servico e chamado pelo nome DNS (ex.: inventario:50052),
# sem saber em que no nem em quantos pods corre.
apiVersion: apps/v1
kind: Deployment
metadata: { name: identidade, namespace: distributed-buy }
spec:
  replicas: 1
  selector: { matchLabels: { app: identidade } }
  template:
    metadata: { labels: { app: identidade } }
    spec:
      containers:
        - name: identidade
          image: distributed-buy/identidade:1.0
          imagePullPolicy: Never
          env: [{ name: SEGREDO_SVC_ENCOMENDAS, valueFrom: { secretKeyRef: { name: segredos, key: servico-encomendas } } }]
          ports: [{ containerPort: 8443 }]
          resources: { requests: { cpu: 50m, memory: 96Mi }, limits: { cpu: 500m, memory: 256Mi } }
          volumeMounts: [{ name: certs, mountPath: /certs, readOnly: true }]
      volumes: [{ name: certs, secret: { secretName: certificados } }]
---
apiVersion: v1
kind: Service
metadata: { name: identidade, namespace: distributed-buy }
spec: { selector: { app: identidade }, ports: [{ port: 8443 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: inventario, namespace: distributed-buy }
spec:
  replicas: 1
  selector: { matchLabels: { app: inventario } }
  template:
    metadata: { labels: { app: inventario } }
    spec:
      containers:
        - name: inventario
          image: distributed-buy/inventario:1.0
          imagePullPolicy: Never
          envFrom: [{ configMapRef: { name: configuracao } }]
          ports: [{ containerPort: 50052 }]
          resources: { requests: { cpu: 100m, memory: 64Mi }, limits: { cpu: 500m, memory: 256Mi } }
          volumeMounts: [{ name: certs, mountPath: /certs, readOnly: true }]
      volumes: [{ name: certs, secret: { secretName: certificados } }]
---
apiVersion: v1
kind: Service
metadata: { name: inventario, namespace: distributed-buy }
spec: { selector: { app: inventario }, ports: [{ port: 50052 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: pagamentos, namespace: distributed-buy }
spec:
  replicas: 1
  selector: { matchLabels: { app: pagamentos } }
  template:
    metadata: { labels: { app: pagamentos } }
    spec:
      containers:
        - name: pagamentos
          image: distributed-buy/pagamentos:1.0
          imagePullPolicy: Never
          env: [{ name: PG_DSN, valueFrom: { configMapKeyRef: { name: configuracao, key: PG_DSN_PAGAMENTOS } } }]
          ports: [{ containerPort: 50053 }]
          resources: { requests: { cpu: 100m, memory: 96Mi }, limits: { cpu: 500m, memory: 256Mi } }
          volumeMounts:
            - { name: certs, mountPath: /certs, readOnly: true }
            - { name: dfs, mountPath: /mnt/dfs }
      volumes:
        - { name: certs, secret: { secretName: certificados } }
        - { name: dfs, persistentVolumeClaim: { claimName: dfs } }
---
apiVersion: v1
kind: Service
metadata: { name: pagamentos, namespace: distributed-buy }
spec: { selector: { app: pagamentos }, ports: [{ port: 50053 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: encomendas, namespace: distributed-buy }
spec:
  replicas: 1
  selector: { matchLabels: { app: encomendas } }
  template:
    metadata: { labels: { app: encomendas } }
    spec:
      containers:
        - name: encomendas
          image: distributed-buy/encomendas:1.0
          imagePullPolicy: Never
          envFrom: [{ configMapRef: { name: configuracao } }]
          env:
            - { name: PG_DSN, valueFrom: { configMapKeyRef: { name: configuracao, key: PG_DSN_ENCOMENDAS } } }
            - { name: SEGREDO_SERVICO, valueFrom: { secretKeyRef: { name: segredos, key: servico-encomendas } } }
          ports: [{ containerPort: 50051 }]
          resources: { requests: { cpu: 100m, memory: 96Mi }, limits: { cpu: 500m, memory: 256Mi } }
          volumeMounts: [{ name: certs, mountPath: /certs, readOnly: true }]
      volumes: [{ name: certs, secret: { secretName: certificados } }]
---
apiVersion: v1
kind: Service
metadata: { name: encomendas, namespace: distributed-buy }
spec: { selector: { app: encomendas }, ports: [{ port: 50051 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: gateway, namespace: distributed-buy }
spec:
  replicas: 1
  selector: { matchLabels: { app: gateway } }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      containers:
        - name: gateway
          image: distributed-buy/gateway:1.0
          imagePullPolicy: Never
          envFrom: [{ configMapRef: { name: configuracao } }]
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /saude, port: 8080 }, periodSeconds: 5 }
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 1000m, memory: 384Mi } }
          volumeMounts:
            - { name: certs, mountPath: /certs, readOnly: true }
            - { name: dfs, mountPath: /mnt/dfs }
      volumes:
        - { name: certs, secret: { secretName: certificados } }
        - { name: dfs, persistentVolumeClaim: { claimName: dfs } }
---
apiVersion: v1
kind: Service
metadata: { name: gateway, namespace: distributed-buy }
spec:
  type: NodePort
  selector: { app: gateway }
  ports: [{ port: 8080, nodePort: 30080 }]
